name: Build Main Package

on:
  push:
    branches: [ main, development ]
    paths:
      - 'src/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-main.yml'
  pull_request:
    branches: [ main, development ]
    paths:
      - 'src/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Build main package
      run: bun run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: main-package-build-${{ matrix.node-version }}
        path: dist/
        retention-days: 5

    - name: Create build status badge
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "✅ Main package build successful"
        else
          echo "❌ Main package build failed"
          exit 1
        fi
